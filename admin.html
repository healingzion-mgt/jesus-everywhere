<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AOTSCheck Admin</title>
<style>
:root{--maroon:#2a0a0a;--maroon2:#150404;--gold:#D4A017;--gold-light:#F2CF7A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--maroon2);color:#fff;min-height:100vh;padding:20px;}
.wrap{max-width:1100px;margin:0 auto;}
h1{color:var(--gold-light);font-size:22px;margin-bottom:16px;}
.gate{max-width:360px;margin:60px auto;background:rgba(255,255,255,.05);border:1px solid rgba(212,160,23,.3);border-radius:14px;padding:24px;}
.gate input{width:100%;padding:12px;border-radius:8px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:15px;margin-bottom:12px;}
.gate button, .toolbar button{background:var(--gold);color:var(--maroon);border:none;padding:12px 18px;border-radius:8px;font-weight:800;cursor:pointer;font-size:15px;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.stat{background:rgba(255,255,255,.05);border:1px solid rgba(212,160,23,.3);border-radius:10px;padding:14px 18px;min-width:110px;}
.stat b{display:block;font-size:24px;color:var(--gold-light);}
.stat span{font-size:12px;color:rgba(255,255,255,.6);}
table{width:100%;border-collapse:collapse;font-size:13px;background:rgba(255,255,255,.03);border-radius:10px;overflow:hidden;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap;}
th{background:rgba(212,160,23,.15);color:var(--gold-light);position:sticky;top:0;}
tr:hover{background:rgba(255,255,255,.04);}
.badge{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:800;}
.b-high{background:rgba(46,204,113,.18);color:#4ee08a;}
.b-mid{background:rgba(212,160,23,.22);color:var(--gold-light);}
.b-low{background:rgba(231,76,60,.18);color:#ff8a7a;}
.scroll{overflow-x:auto;}
.hidden{display:none;}
.err{color:#ff8a7a;font-size:13px;margin-top:-6px;margin-bottom:10px;display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div id="gateScreen" class="gate">
    <h1 style="text-align:center;">AOTSCheck Admin</h1>
    <p style="text-align:center;color:rgba(255,255,255,.6);font-size:13px;margin-bottom:16px;">Enter your admin key to view results</p>
    <input type="password" id="adminKey" placeholder="Admin key">
    <div class="err" id="gateErr">Wrong key, or couldn't connect. Try again.</div>
    <button style="width:100%;" onclick="loadData()">View Results</button>
  </div>

  <div id="dataScreen" class="hidden">
    <h1>AOTSCheck — Jesus Everywhere</h1>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <div style="color:rgba(255,255,255,.6);font-size:13px;" id="countLine"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button onclick="exportCSV()">Export as CSV</button>
        <button style="background:rgba(231,76,60,.85);color:#fff;" onclick="clearHistory()">🗑 Clear ALL History</button>
      </div>
    </div>
    <div class="err" id="clearMsg" style="color:#4ee08a;display:none;"></div>
    <div class="scroll">
      <table id="resultsTable">
        <thead>
          <tr>
            <th>Date</th><th>Name</th><th>Location</th><th>Score</th><th>Category</th>
            <th>Worship</th><th>Word</th><th>Prayer</th><th>Testimony</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API_BASE = "https://bizcheck-api.healingzion7.workers.dev";
let allRows = [];
let savedKey = "";

function loadData(){
  const key = document.getElementById('adminKey').value.trim();
  if(!key) return;
  fetch(API_BASE + "/api/admin/aots?key=" + encodeURIComponent(key))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data.ok){ throw new Error("unauthorized"); }
      savedKey = key;
      allRows = data.results;
      document.getElementById('gateScreen').classList.add('hidden');
      document.getElementById('dataScreen').classList.remove('hidden');
      render();
    })
    .catch(function(){
      document.getElementById('gateErr').style.display = 'block';
    });
}

function clearHistory(){
  if(!confirm("This permanently deletes ALL AOTSCheck submissions and resets the public counter back to 0. This cannot be undone. Continue?")) return;
  fetch(API_BASE + "/api/admin/aots/clear?key=" + encodeURIComponent(savedKey), { method: "POST" })
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data.ok){ throw new Error("failed"); }
      allRows = [];
      render();
      const msg = document.getElementById('clearMsg');
      msg.textContent = "✅ History cleared. The public counter is now back to 0.";
      msg.style.display = 'block';
      setTimeout(function(){ msg.style.display = 'none'; }, 5000);
    })
    .catch(function(){
      alert("Couldn't clear history — check your connection and try again.");
    });
}

function badgeClass(cat){
  const c = (cat||"").toUpperCase();
  if(c.indexOf("HUNGRY") !== -1 || c.indexOf("ON FIRE") !== -1 || c.indexOf("BLAZING") !== -1) return "b-high";
  if(c.indexOf("STIRRING") !== -1 || c.indexOf("GROWING") !== -1) return "b-mid";
  return "b-low";
}

function render(){
  document.getElementById('countLine').textContent = allRows.length + " submissions";
  const avg = allRows.length ? Math.round(allRows.reduce((a,r)=>a+r.score,0)/allRows.length) : 0;

  const locCounts = {};
  allRows.forEach(function(r){
    const loc = (r.location || "Unknown").trim() || "Unknown";
    locCounts[loc] = (locCounts[loc] || 0) + 1;
  });
  const uniqueLocations = Object.keys(locCounts).length;
  const topLocations = Object.entries(locCounts).sort(function(a,b){ return b[1]-a[1]; }).slice(0,5);
  const topLocLine = topLocations.map(function(e){ return e[0] + " (" + e[1] + ")"; }).join(", ");

  document.getElementById('stats').innerHTML =
    '<div class="stat"><b>'+allRows.length+'</b><span>Total Responses</span></div>' +
    '<div class="stat"><b>'+avg+'</b><span>Average Score</span></div>' +
    '<div class="stat"><b>'+uniqueLocations+'</b><span>States/Countries Reached</span></div>' +
    '<div class="stat" style="min-width:240px;"><span style="font-size:12px;color:rgba(255,255,255,.6);display:block;margin-bottom:4px;">Top Locations</span><span style="font-size:14px;color:var(--gold-light);">'+(topLocLine||'—')+'</span></div>';

  const body = document.getElementById('resultsBody');
  body.innerHTML = allRows.map(function(r){
    return '<tr>' +
      '<td>'+(r.created_at||'').slice(0,16).replace('T',' ')+'</td>' +
      '<td>'+esc(r.name)+'</td>' +
      '<td>'+esc(r.location)+'</td>' +
      '<td><b>'+r.score+'</b></td>' +
      '<td><span class="badge '+badgeClass(r.category)+'">'+esc(r.category)+'</span></td>' +
      '<td>'+r.worship+'</td><td>'+r.word+'</td><td>'+r.prayer+'</td><td>'+r.testimony+'</td>' +
      '</tr>';
  }).join('');
}

function esc(v){ return (v===null||v===undefined) ? '' : String(v).replace(/</g,'&lt;'); }

function exportCSV(){
  const headers = ["Date","Name","Location","Score","Category","Worship","Word","Prayer","Testimony"];
  const rows = allRows.map(function(r){
    return [r.created_at, r.name, r.location, r.score, r.category, r.worship, r.word, r.prayer, r.testimony]
      .map(function(v){ v = (v===null||v===undefined)?'':String(v); return '"' + v.replace(/"/g,'""') + '"'; })
      .join(',');
  });
  const csv = headers.join(',') + '\n' + rows.join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'aotscheck-results.csv';
  a.click();
}
</script>
</body>
</html>
